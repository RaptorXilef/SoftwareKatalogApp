name: Build and Upload Release

# Startet den Workflow automatisch, wenn ein Release veröffentlicht wird
on:
  release:
    types: [published]

jobs:
  build:
    name: Build Windows EXE & ZIP
    runs-on: windows-latest # Wir nutzen Windows, um die Dateien nativ zu bauen

    # Gibt dem automatischen Token die Rechte, Dateien zum Release hochzuladen
    permissions:
      contents: write

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: ⚙️ Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "26.12.1" # Nutzt aktuelle stabile Node-Version
          cache: "npm"

      - name: 📦 Electron-Builder Cache aktivieren
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\electron-builder
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: 📦 Abhängigkeiten installieren
        run: npm install

      - name: 🏗️ App-Build (Portable & ZIP)
        run: npm run build:dist

      - name: 🚀 Dateien an GitHub Release anhängen
        uses: softprops/action-gh-release@v2
        with:
          # Der Pfad zur gebauten EXE, wie in deiner package.json definiert
          files: |
            dist/SoftwareKatalog-Portable.exe
            dist/*.zip
            scanner.mjs
