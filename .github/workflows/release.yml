name: Build and Upload Release

# Startet den Workflow automatisch, wenn ein Release veröffentlicht wird
on:
  release:
    types: [published]

jobs:
  build:
    name: Build Windows Installer, Portable & ZIP
    runs-on: windows-latest # Wir nutzen Windows, um die Dateien nativ zu bauen

    # Gibt dem automatischen Token die Rechte, Dateien zum Release hochzuladen
    permissions:
      contents: write

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: ⚙️ Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "26.12.1" # Nutzt aktuelle stabile Node-Version
          cache: "npm"

      - name: 📦 Electron-Builder Cache aktivieren
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\electron-builder
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: 📦 Abhängigkeiten installieren
        run: npm ci

      - name: 🧹 Biome Code- & Format-Check
        run: npm run chk:biome

      - name: 🔍 Typecheck
        run: npm run typecheck

      - name: 🧪 Unit-Tests
        run: npm test

      - name: 🏗️ App-Build (NSIS Setup, Portable & ZIP)
        run: npm run build:dist

      - name: 🚀 Dateien an GitHub Release anhängen
        uses: softprops/action-gh-release@v2
        with:
          # Pfade zu den gebauten Windows-Artefakten gemaess package.json
          files: |
            dist/*Setup*.exe
            dist/SoftwareKatalog-Portable.exe
            dist/*.zip
