<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Software Katalog</title>
  <style>
    :root {
      --bg: #1e1e2e; --surface: #2a2a3f; --text: #cdd6f4;
      --accent: #89b4fa; --accent-hover: #b4befe; --border: #45475a;
    }
    body {
      margin: 0; padding: 20px; font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg); color: var(--text);
    }
    /* Toolbar & Search */
    .toolbar {
      display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px;
    }
    input[type="text"] {
      padding: 12px 20px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 16px;
      width: 100%; max-width: 400px;
    }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag {
      padding: 5px 12px; border-radius: 20px; background: var(--surface);
      cursor: pointer; border: 1px solid var(--border); transition: 0.2s;
    }
    .tag.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    
    /* Grid */
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;
    }
    .card {
      background: var(--surface); padding: 20px; border-radius: 12px; cursor: pointer;
      text-align: center; border: 1px solid var(--border); transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-5px); border-color: var(--accent); }
    .card img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 15px; }
    
    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .modal {
      background: var(--surface); padding: 30px; border-radius: 12px;
      width: 100%; max-width: 600px; position: relative; border: 1px solid var(--border);
    }
    .modal h2 { margin-top: 0; }
    .close-btn {
      position: absolute; top: 15px; right: 20px; font-size: 24px;
      cursor: pointer; color: var(--text); border: none; background: none;
    }
    .action-btn {
      display: inline-block; padding: 10px 20px; background: var(--accent);
      color: var(--bg); border: none; border-radius: 6px; cursor: pointer;
      font-weight: bold; margin-top: 20px; text-decoration: none;
    }
    .action-btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <div class="toolbar">
    <div style="display: flex; gap: 15px; width: 100%;">
      <input type="text" id="searchInput" placeholder="Software suchen..." style="flex: 1;">
      <button id="btnScan" class="action-btn" style="margin: 0;" onclick="startScan(false)">Neu scannen</button>
      <button id="btnFullScan" class="action-btn" style="margin: 0; background: var(--border);" onclick="startScan(true)">Vollständiger Rescan</button>
    </div>
    <div class="tags" id="tagContainer"></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="modalContent">
      <!-- Modal Content gets injected here -->
    </div>
  </div>

  <script>
    let catalog = [];
    let activeTag = null;

    async function init() {
        try {
        if (window.electronAPI) {
            catalog = await window.electronAPI.loadCatalog();
        } else {
            // Fallback für reine Browser-Ansicht
            const res = await fetch('catalog.json');
            catalog = await res.json();
        }
        
        if(catalog.length === 0) {
            document.getElementById('grid').innerHTML = '<p>Katalog leer. Bitte zuerst scannen.</p>';
        } else {
            renderTags();
            renderGrid();
        }
        } catch (e) {
        document.getElementById('grid').innerHTML = '<p>Fehler: Konnte Daten nicht laden.</p>';
        }
    }

    async function startScan(isFull) {
      if (!window.electronAPI) return alert("Scannen ist nur in der Desktop-App möglich.");
      
      const btnScan = document.getElementById('btnScan');
      const btnFullScan = document.getElementById('btnFullScan');
      const grid = document.getElementById('grid');

      // UI sperren
      btnScan.disabled = true;
      btnFullScan.disabled = true;
      btnScan.innerText = "Scan läuft...";
      grid.innerHTML = '<div style="text-align: center; grid-column: 1 / -1; padding: 40px;"><p>Durchsuche NAS-Laufwerk... Das kann einen Moment dauern.</p></div>';

      try {
        const output = await window.electronAPI.runScan(isFull);
        console.log(output); 
        await init(); // Nach Scan neu laden (rendert das Grid wieder)
      } catch (error) {
        if(error.includes("LOCKED")) {
          alert("Scan abgebrochen: Ein anderes Familienmitglied führt gerade einen Scan durch.");
        } else {
          alert("Fehler beim Scannen:\n" + error);
        }
        init(); // Versuche den alten Zustand wiederherzustellen
      } finally {
        // UI wieder entsperren
        btnScan.disabled = false;
        btnFullScan.disabled = false;
        btnScan.innerText = "Neu scannen";
      }
    }

    function renderTags() {
      const allTags = new Set();
      catalog.forEach(item => item.tags.forEach(t => allTags.add(t)));
      
      const container = document.getElementById('tagContainer');
      container.innerHTML = `<div class="tag ${!activeTag ? 'active' : ''}" onclick="filterByTag(null)">Alle</div>`;
      
      Array.from(allTags).sort().forEach(tag => {
        container.innerHTML += `<div class="tag ${activeTag === tag ? 'active' : ''}" onclick="filterByTag('${tag}')">${tag}</div>`;
      });
    }

    function filterByTag(tag) {
      activeTag = tag;
      renderTags();
      renderGrid();
    }

    document.getElementById('searchInput').addEventListener('input', renderGrid);

    function renderGrid() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('grid');
      
      const filtered = catalog.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(search) || item.description.toLowerCase().includes(search);
        const matchesTag = !activeTag || item.tags.includes(activeTag);
        return matchesSearch && matchesTag;
      });

      grid.innerHTML = filtered.map(item => `
        <div class="card" onclick="openModal('${item.id}')">
          ${item.icon ? `<img src="file:///${item.icon.replace(/\\/g, '/')}" alt="Icon" onerror="this.style.display='none'">` : ''}
          <h3>${item.name}</h3>
          <small>${item.tags.join(', ')}</small>
        </div>
      `).join('');
    }

    function openModal(id) {
      const item = catalog.find(i => i.id === id);
      if (!item) return;

      const osBadges = item.os.length > 0 ? `<p><strong>OS:</strong> ${item.os.join(', ')}</p>` : '';
      const catText = item.mainCategory ? `<p><strong>Kategorie:</strong> ${item.mainCategory} ${item.subCategories.length > 0 ? `(${item.subCategories.join(', ')})` : ''}</p>` : '';
      
      let downloadHtml = '';
      if (item.lastFiles && item.lastFiles.length > 0) {
        downloadHtml = `
          <button class="action-btn" style="background: #a6e3a1; color: #1e1e2e; margin-left: 10px;" 
                  onclick='startDownload(${JSON.stringify(item.lastFiles)})'>
            Neueste Version downloaden (${item.lastFiles.length} Datei/en)
          </button>`;
      }

      // 1. Links generieren
      let linksHtml = '';
      if (item.links && item.links.length > 0) {
        linksHtml = `<div style="margin-top: 15px;"><strong>Links:</strong><ul style="margin-top: 5px;">` + 
          item.links.map(l => `<li><a href="#" style="color: var(--accent);" onclick="openExternalUrl('${l.url}')">${l.label}</a></li>`).join('') + 
        `</ul></div>`;
      }

      // 2. Screenshots generieren
      let imagesHtml = '';
      if (item.screenshots && item.screenshots.length > 0) {
        imagesHtml = `<div style="margin-top: 20px; display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px;">` + 
          item.screenshots.map(s => `<img src="file:///${s.replace(/\\/g, '/')}" style="height: 120px; border-radius: 8px; border: 1px solid var(--border); object-fit: cover;">`).join('') +
        `</div>`;
      }

      const modal = document.getElementById('modalContent');
      modal.innerHTML = `
        <button class="close-btn" onclick="document.getElementById('modalOverlay').style.display='none'">&times;</button>
        <div style="display: flex; gap: 20px; align-items: flex-start;">
          ${item.icon ? `<img src="file:///${item.icon.replace(/\\/g, '/')}" style="width: 80px; height: 80px; object-fit: contain;">` : ''}
          <div>
            <h2>${item.name}</h2>
            ${osBadges}
            ${catText}
          </div>
        </div>
        <div style="margin-top: 20px;">
          <p>${item.description || 'Keine Beschreibung vorhanden.'}</p>
          ${linksHtml}
          ${imagesHtml}
          <p><small style="color: gray;">Pfad: ${item.path}</small></p>
        </div>
        <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
          <button class="action-btn" onclick="openInExplorer('${item.path.replace(/\\/g, '\\\\')}')">Im Explorer öffnen</button>
          ${downloadHtml}
        </div>
      `;
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    // Neue kleine Hilfsfunktion für Weblinks
    function openExternalUrl(url) {
      if (window.electronAPI) {
        window.electronAPI.openUrl(url);
      } else {
        window.open(url, '_blank'); // Fallback für reinen Browser
      }
    }

    // Neue Funktion für den Download
    async function startDownload(files) {
      const btn = event.target;
      const originalText = btn.innerText;
      btn.innerText = "Kopiere...";
      btn.disabled = true;

      const res = await window.electronAPI.downloadFiles(files);
      
      if (res.success) {
        alert("Erfolgreich gespeichert unter:\n" + res.dest);
      } else if (res.error) {
        alert("Fehler beim Kopieren:\n" + res.error);
      }
      
      btn.innerText = originalText;
      btn.disabled = false;
    }

    function closeModal(e) {
      if (e.target.id === 'modalOverlay') e.target.style.display = 'none';
    }

    function openInExplorer(path) {
      // Diese Funktion wird in Electron abgefangen
      if (window.electronAPI) {
        window.electronAPI.openPath(path);
      } else {
        alert("Um Ordner nativ zu öffnen, muss die App über Electron gestartet werden.\\nPfad: " + path);
      }
    }

    init();
  </script>
</body>
</html>
