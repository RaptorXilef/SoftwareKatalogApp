<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Software Katalog by © Felix Maywald</title>
  <!-- Behebt die Electron Security Warning -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; connect-src 'self';">
  <style>
    :root {
      --bg: #1e1e2e; --surface: #2a2a3f; --text: #cdd6f4;
      --accent: #89b4fa; --accent-hover: #b4befe; --border: #45475a;
    }
    body {
      margin: 0; padding: 20px; font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg); color: var(--text);
    }
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 24px; color: var(--accent); display: flex; align-items: baseline; gap: 10px; }
    .header .subtitle { font-size: 14px; color: var(--text); opacity: 0.7; font-weight: normal; }
    .icon-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text); transition: color 0.2s, transform 0.2s; padding: 5px; }
    .icon-btn:hover { color: var(--accent); transform: rotate(90deg); }

    /* Toolbar & Search */
    .toolbar { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
    input[type="text"], input[type="number"] {
      padding: 12px 20px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 16px;
    }
    #searchInput { width: 100%; max-width: 400px; }

    /* Collapsible Tags */
    details { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    summary { font-weight: bold; cursor: pointer; user-select: none; color: var(--accent); }
    summary:hover { color: var(--accent-hover); }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
    .tag { padding: 5px 12px; border-radius: 20px; background: var(--bg); cursor: pointer; border: 1px solid var(--border); transition: 0.2s; }
    .tag.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

    /* Settings UI */
    .settings-row { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
    .settings-row input[type="text"] { flex: 1; }
    .settings-group { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 20px; }
    .checkbox-lbl { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-top: 5px;}
    .hidden-cats-list { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: var(--surface); padding: 20px; border-radius: 12px; cursor: pointer; text-align: center; border: 1px solid var(--border); transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); border-color: var(--accent); }
    .card img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 15px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 100; overflow-y: auto;}
    .modal { background: var(--surface); padding: 30px; border-radius: 12px; width: 100%; max-width: 1100px; position: relative; border: 1px solid var(--border); margin: auto; }
    .modal h2, .modal h3 { margin-top: 0; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: var(--text); border: none; background: none; }
    .action-btn { display: inline-block; padding: 10px 20px; background: var(--accent); color: var(--bg); border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 20px; text-decoration: none; }
    .action-btn:hover { background: var(--accent-hover); }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Bild-Zoom (Lightbox) */
    .img-zoomable { cursor: zoom-in; transition: transform 0.2s; }
    .img-zoomable:hover { transform: scale(1.05); }
    .lightbox-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 10000; cursor: zoom-out; padding: 40px; }
    .lightbox-overlay img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

    /* Scan Animation */
    .scan-status { text-align: center; grid-column: 1 / -1; padding: 40px; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); }
    .scan-path { color: var(--accent); font-size: 0.9em; word-break: break-all; margin-top: 10px; font-family: monospace; }
    .spinner { border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>Software Katalog <span class="subtitle">by © Felix Maywald <span id="appVersion"></span></span></h1>
    <button type="button" class="icon-btn" onclick="_openSettings()" title="Einstellungen" aria-label="Einstellungen">⚙️</button>
  </div>

  <div class="toolbar">
    <div style="display: flex; gap: 15px; width: 100%; flex-wrap: wrap;">
      <input type="text" id="searchInput" placeholder="Software suchen..." style="flex: 1; min-width: 250px;">
      <button type="button" id="btnScan" class="action-btn" style="margin: 0;" onclick="_startScan('quick')" title="Sucht netzwerkschonend nach neuen Software-Ordnern. Bekannte Ordner werden übersprungen.">Neu scannen</button>
      <button type="button" id="btnUpdate" class="action-btn" style="margin: 0; background: #a6e3a1; color: var(--bg);" onclick="_startScan('update')" title="Liest Metadaten und Bilder der bereits bekannten Programme blitzschnell neu ein.">Metadaten aktualisieren</button>
      <button type="button" id="btnFullScan" class="action-btn" style="margin: 0; background: var(--border);" onclick="_startScan('full')" title="Verwirft den aktuellen Katalog und liest das gesamte Laufwerk komplett neu ein.">Vollständiger Rescan</button>
    </div>

    <!-- Collapsible Tags -->
    <details id="tagsDetails">
      <summary>Kategorien & Filter ein/ausblenden</summary>
      <div class="tags" id="tagContainer"></div>
    </details>
  </div>

  <div class="grid" id="grid"></div>

  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" onclick="_closeModal(event)" onkeydown="if(event.key === 'Escape') _closeModal(event)">
    <div class="modal" id="modalContent">
      <!-- Modal Content gets injected here -->
    </div>
  </div>

  <!-- Das Lightbox-Overlay für große Bilder (mit a11y Fixes) -->
  <div class="lightbox-overlay" id="lightboxOverlay" role="dialog" aria-modal="true" onclick="this.style.display='none'" onkeydown="if(event.key === 'Escape' || event.key === 'Enter') this.style.display='none'">
    <img id="lightboxImg" src="" alt="Vollbildansicht">
  </div>

  <script>
    let catalog = [];
    let activeTag = null;
    let appSettings = {};
    let availableHiddenCats = [];
    let hasCheckedForUpdates = false; // Verhindert mehrfaches Prüfen während einer Sitzung

    if (window.electronAPI) {
      window.electronAPI.onScanStart((path) => {
        const el = document.getElementById('scanTargetText');
        if (el) el.textContent = `Durchsuche Laufwerk (${path})... Das kann einen Moment dauern.`;
      });
      window.electronAPI.onScanProgress((path) => {
        const el = document.getElementById('scanPathText');
        if (el) el.textContent = path;
      });
    }

    async function init() {
      try {
        if (window.electronAPI) {
          catalog = await window.electronAPI.loadCatalog();
          appSettings = await window.electronAPI.getSettings();
        } else {
          catalog = await (await fetch('catalog.json')).json();
        }

        availableHiddenCats = [...new Set(catalog.map(i => i.hiddenCategory).filter(c => c))];

        catalog.forEach(item => {
          item.tags = [];
          if (item.mainCategory) item.tags.push(item.mainCategory);
          if (item.subCategories) item.tags.push(...item.subCategories);
        });

        if (catalog.length === 0) {
          document.getElementById('grid').innerHTML = '<p>Katalog leer. Bitte zuerst scannen.</p>';
        } else {
          renderTags();
          renderGrid();
          _performAutoUpdateCheck(); // Führt Prüfung im Hintergrund aus, falls Intervall erreicht
        }
      } catch (error) {
        console.error('Fehler beim Initialisieren:', error);
        document.getElementById('grid').innerHTML = `<p>Fehler: Konnte Daten nicht laden. Details: ${error.message || error}</p>`;
      }
    }

    async function _startScan(mode) {
      if (!window.electronAPI) return alert("Scannen ist nur in der Desktop-App möglich.");

      const btns = ['btnScan', 'btnUpdate', 'btnFullScan'].map(id => document.getElementById(id));
      btns.forEach(b => { b.disabled = true; });

      const grid = document.getElementById('grid');
      grid.innerHTML = `
        <div class="scan-status">
          <div class="spinner"></div>
          <p id="scanTargetText">Scanner wird initialisiert...</p>
          <p id="scanPathText" class="scan-path">Warte auf Verzeichnisse...</p>
        </div>
      `;

      try {
        await window.electronAPI.runScan(mode);
        await init(); // Nach Scan neu laden (rendert das Grid wieder)
      } catch (error) {
        console.error('Scan-Fehler:', error);
        if(error.message?.includes("LOCKED") || error.includes?.("LOCKED")) {
            alert("Scan abgebrochen: Ein anderes Familienmitglied führt gerade einen Scan durch.");
        } else {
            alert(`Fehler beim Scannen:\n${error.message || error}`);
        }
        init(); // Versuche den alten Zustand wiederherzustellen
      } finally {
        btns.forEach(b => { b.disabled = false; });
      }
    }

    function renderTags() {
      const allTags = new Set();
      // forEach ohne automatischen Return via geschweifte Klammern
      catalog.forEach(item => {
        // Filtere versteckte Kategorien auch für die Tag-Generierung raus
        const isHidden = item.hiddenCategory && item.hiddenCategory.trim() !== '';
        if (isHidden && (!appSettings.visibleHiddenCats?.includes(item.hiddenCategory))) return;

        item.tags.forEach(t => { allTags.add(t); });
      });

      const container = document.getElementById('tagContainer');
      container.innerHTML = `<div class="tag ${!activeTag ? 'active' : ''}" onclick="_filterByTag(null)">Alle</div>`;

      Array.from(allTags).sort().forEach(tag => {
        container.innerHTML += `<div class="tag ${activeTag === tag ? 'active' : ''}" onclick="_filterByTag('${tag}')">${tag}</div>`;
      });
    }

    function _filterByTag(tag) { activeTag = tag; renderTags(); renderGrid(); }

    // Fuzzy Search Helpers
    function getEditDistance(a, b) {
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      const v0 = new Array(b.length + 1), v1 = new Array(b.length + 1);
      for (let i = 0; i <= b.length; i++) v0[i] = i;
      for (let i = 0; i < a.length; i++) {
        v1[0] = i + 1;
        for (let j = 0; j < b.length; j++) {
          const cost = a[i] === b[j] ? 0 : 1;
          v1[j + 1] = Math.min(v1[j] + 1, v0[j + 1] + 1, v0[j] + cost);
        }
        for (let j = 0; j <= b.length; j++) v0[j] = v1[j];
      }
      return v1[b.length];
    }

    // Prüft, ob ein Suchwort (mit Toleranz für Tippfehler) im Text existiert
    function fuzzyMatch(searchWord, fullText) {
      if (fullText.includes(searchWord)) return true;
      if (searchWord.length < 3) return false; // Sehr kurze Wörter müssen exakt passen

      const wordsInText = fullText.split(/[^a-z0-9äöüß]+/);
      for (const textWord of wordsInText) {
        if (textWord.length < 3) continue;
        // Erlaubt 1 Fehler bei kurzen Wörtern, 2 bei längeren
        if (getEditDistance(searchWord, textWord) <= (searchWord.length <= 5 ? 1 : 2)) return true;
      }
      return false;
    }

    document.getElementById('searchInput').addEventListener('input', renderGrid);

    function renderGrid() {
      const searchString = document.getElementById('searchInput').value.toLowerCase().trim();
      const searchWords = searchString.split(/\s+/).filter(w => w.length > 0);
      const grid = document.getElementById('grid');

      const filtered = catalog.filter(item => {
        // Versteckte Kategorien filtern
        const isHidden = item.hiddenCategory && item.hiddenCategory.trim() !== '';
        if (isHidden && (!appSettings.visibleHiddenCats?.includes(item.hiddenCategory))) return false;

        // Suchbereich: Name, Beschreibung, Formate und alle Tags zusammenfassen
        const searchText = `${item.name} ${item.description} ${item.tags.join(' ')} ${item.formats ? item.formats.join(' ') : ''}`.toLowerCase();
        const matchesTag = !activeTag || item.tags.includes(activeTag);

        // Multi-Word UND-Suche mit Fuzzy Matching
        let matchesSearch = true;
        for (const word of searchWords) {
          if (!fuzzyMatch(word, searchText)) { matchesSearch = false; break; }
        }
        return matchesSearch && matchesTag;
      });

      grid.innerHTML = filtered.map(item => `
        <div class="card" onclick="_openModal('${item.id}')">
          ${item.icon ? `<img src="file:///${item.icon.replace(/\\/g, '/')}" loading="lazy" decoding="async" alt="Icon" onerror="this.style.display='none'">` : ''}
          <h3>${item.name}</h3>
          <small>${item.tags.join(', ')}</small>
        </div>
      `).join('');
    }

    function _openModal(id) {
      const item = catalog.find(i => i.id === id);
      if (!item) return;

      const osBadges = item.os.length > 0 ? `<p><strong>OS:</strong> ${item.os.join(', ')}</p>` : '';
      const formatBadges = (item.formats && item.formats.length > 0) ? `<p><strong>Formate:</strong> ${item.formats.join(', ')}</p>` : '';
      const catText = item.mainCategory ? `<p><strong>Kategorie:</strong> ${item.mainCategory} ${item.subCategories.length > 0 ? `(${item.subCategories.join(', ')})` : ''}</p>` : '';

      let downloadHtml = '';
      if (item.lastFiles && item.lastFiles.length > 0) {
        downloadHtml = `
          <button type="button" class="action-btn" style="background: #a6e3a1; color: #1e1e2e; margin-left: 10px;"
                  onclick='_startDownload(${JSON.stringify(item.lastFiles)})'>
            Neueste Version downloaden (${item.lastFiles.length} Datei/en)
          </button>`;
      }

      // 1. Links generieren
      let linksHtml = '';
      if (item.links && item.links.length > 0) {
        linksHtml = `<div style="margin-top: 15px;"><strong>Links:</strong><ul style="margin-top: 5px;">` +
          item.links.map(l => `<li><a href="#" style="color: var(--accent);" onclick="_openExternalUrl('${l.url}')">${l.label}</a></li>`).join('') +
        `</ul></div>`;
      }

      // 2. Screenshots generieren (Klick öffnet Lightbox)
      let imagesHtml = '';
      if (item.screenshots && item.screenshots.length > 0) {
        imagesHtml = `<div style="margin-top: 20px; display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px;">` +
          item.screenshots.map(s => {
            const fileUrl = `file:///${s.replace(/\\/g, '/')}`;
            return `<img src="${fileUrl}" class="img-zoomable" onclick="_openLightbox('${fileUrl}')" style="height: 120px; min-width: 150px; border-radius: 8px; border: 1px solid var(--border); object-fit: cover;">`;
          }).join('') +
        `</div>`;
      }

      document.getElementById('modalContent').innerHTML = `
        <button type="button" class="close-btn" onclick="document.getElementById('modalOverlay').style.display='none'" title="Schließen" aria-label="Schließen">&times;</button>
        <div style="display: flex; gap: 20px; align-items: flex-start;">
          ${item.icon ? `<img src="file:///${item.icon.replace(/\\/g, '/')}" style="width: 80px; height: 80px; object-fit: contain;">` : ''}
          <div>
            <h2>${item.name}</h2>
            ${osBadges} ${formatBadges} ${catText}
          </div>
        </div>
        <div style="margin-top: 20px;">
          <p>${item.description || 'Keine Beschreibung vorhanden.'}</p>
          ${linksHtml} ${imagesHtml}
          <p><small style="color: gray;">Pfad: ${item.path}</small></p>
        </div>
        <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
          <button type="button" class="action-btn" onclick="_openInExplorer('${item.path.replace(/\\/g, '\\\\')}')">Im Explorer öffnen</button>
          ${downloadHtml}
        </div>
      `;
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function _openExternalUrl(url) { window.electronAPI ? window.electronAPI.openUrl(url) : window.open(url, '_blank'); }

    async function _startDownload(files) {
      const btn = event.target; const originalText = btn.textContent;
      btn.textContent = "Kopiere..."; btn.disabled = true;
      const res = await window.electronAPI.downloadFiles(files);
      if (res.success) alert(`Erfolgreich gespeichert unter:\n${res.dest}`);
      else if (res.error) alert(`Fehler beim Kopieren:\n${res.error}`);
      btn.textContent = originalText; btn.disabled = false;
    }

    function _closeModal(e) { if (e.target.id === 'modalOverlay') e.target.style.display = 'none'; }
    function _openInExplorer(path) { window.electronAPI ? window.electronAPI.openPath(path) : alert(`App über Electron starten.`); }
    function _openLightbox(src) { document.getElementById('lightboxImg').src = src; document.getElementById('lightboxOverlay').style.display = 'flex'; }

    async function _loadAppInfo() {
      if (window.electronAPI) {
        const info = await window.electronAPI.getAppInfo();
        document.getElementById('appVersion').textContent = `(v${info.version})`;
      }
    }

    async function _performAutoUpdateCheck() {
      if (!window.electronAPI || hasCheckedForUpdates) return;
      hasCheckedForUpdates = true;

      const s = appSettings;
      if (s.updateInterval === -1) return; // Einstellung "Nie"

      const now = Date.now();
      const msSinceLast = now - (s.lastUpdateCheck || 0);
      const intervalMs = (s.updateInterval || 0) * 60 * 60 * 1000;

      if (msSinceLast >= intervalMs) {
        const res = await window.electronAPI.checkUpdate();
        if (res && !res.error && res.updateAvailable) {
           const versionEl = document.getElementById('appVersion');
           versionEl.innerHTML = `(v${res.currentVersion}) <a href="#" onclick="_openExternalUrl('${res.releaseUrl}')" style="color: #a6e3a1; font-size: 0.9em; text-decoration: none; margin-left: 10px;">🎁 Update verfügbar (v${res.latestVersion})!</a>`;
        }
      }
    }

    async function _openSettings() {
      if (!window.electronAPI) return alert("Einstellungen sind nur in der Desktop-App verfügbar.");

      const s = await window.electronAPI.getSettings();
      const info = await window.electronAPI.getAppInfo();

      const hiddenCheckboxes = availableHiddenCats.length === 0
        ? '<p style="color: gray; font-size: 0.9em;">Bisher wurden keine versteckten Kategorien gefunden.</p>'
        : availableHiddenCats.map(cat => {
            const isChecked = s.visibleHiddenCats?.includes(cat) ? 'checked' : '';
            return `<label class="checkbox-lbl"><input type="checkbox" name="hiddenCatCheck" value="${cat}" ${isChecked}> ${cat}</label>`;
          }).join('');

      document.getElementById('modalContent').innerHTML = `
        <button type="button" class="close-btn" onclick="document.getElementById('modalOverlay').style.display='none'" title="Schließen" aria-label="Schließen">&times;</button>
        <h2>Einstellungen</h2>

        <div class="settings-group" style="border-top: none; margin-top: 0; padding-top: 0;">
          <h3>Dateipfade</h3>
          <div class="settings-row">
            <label style="width: 120px;">Software-Ordner:</label>
            <input type="text" id="cfgTarget" value="${s.targetPath}" readonly>
            <button type="button" class="action-btn" style="margin-top: 0; background: var(--surface); border: 1px solid var(--border); color: var(--text);" onclick="_browseFile('cfgTarget', true)">Wählen</button>
          </div>
          <div class="settings-row">
            <label style="width: 120px;">Katalog (JSON):</label>
            <input type="text" id="cfgJson" value="${s.jsonPath}" readonly>
            <button type="button" class="action-btn" style="margin-top: 0; background: var(--surface); border: 1px solid var(--border); color: var(--text);" onclick="_browseFile('cfgJson', false, [{name: 'JSON', extensions: ['json']}])">Wählen</button>
          </div>
          <div class="settings-row">
            <label style="width: 120px;">Scanner-Skript:</label>
            <input type="text" id="cfgScript" value="${s.scriptPath}" readonly>
            <button type="button" class="action-btn" style="margin-top: 0; background: var(--surface); border: 1px solid var(--border); color: var(--text);" onclick="_browseFile('cfgScript', false, [{name: 'JavaScript', extensions: ['mjs', 'js']}])">Wählen</button>
          </div>
        </div>

        <div class="settings-group">
          <h3>Scanner-Tiefe</h3>
          <label class="checkbox-lbl">
            <input type="checkbox" id="cfgScanNested" ${s.scanNested ? 'checked' : ''}>
            Nach Fund eines _metadata Ordners noch tiefere Ebenen durchsuchen
          </label>
          <div class="settings-row" style="margin-top: 10px;">
            <label style="width: 250px;">Maximale Ebenen tiefer suchen:</label>
            <input type="number" id="cfgNestedDepth" value="${s.nestedDepth || 1}" min="1" max="5" style="width: 80px; flex: none;">
          </div>
        </div>

        <div class="settings-group">
          <h3>Sichtbarkeit versteckter Kategorien</h3>
          <p style="font-size: 0.9em; margin-top: 0;">Aktiviere Kategorien, um Software anzuzeigen, die in ihrer meta.json einen <code>hiddenCategory</code> Eintrag besitzt.</p>
          <div class="hidden-cats-list">
            ${hiddenCheckboxes}
          </div>
        </div>

        <div class="settings-group">
          <h3>Updates</h3>
          <div class="settings-row">
            <label style="width: 250px;">Automatisch nach Updates suchen:</label>
            <select id="cfgUpdateInterval" style="flex: 1; padding: 10px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px;">
              <option value="0" ${s.updateInterval === 0 ? 'selected' : ''}>Bei jedem Start</option>
              <option value="24" ${s.updateInterval === 24 ? 'selected' : ''}>Täglich (alle 24h)</option>
              <option value="168" ${s.updateInterval === 168 ? 'selected' : ''}>Wöchentlich</option>
              <option value="720" ${s.updateInterval === 720 ? 'selected' : ''}>Monatlich</option>
              <option value="-1" ${s.updateInterval === -1 ? 'selected' : ''}>Nie</option>
            </select>
          </div>
        </div>

        <div class="settings-group">
          <h3>Über (About)</h3>
          <p style="margin-top: 5px; margin-bottom: 15px;">
            <strong>Software Katalog</strong> v${info.version}<br>
            Entwickelt von <strong>Felix Maywald / RaptorXilef</strong>
          </p>
          <div class="settings-row" style="align-items: center; justify-content: flex-start;">
            <button type="button" class="action-btn" style="margin-top: 0; background: var(--surface); border: 1px solid var(--border); color: var(--text);" onclick="_openExternalUrl('https://github.com/RaptorXilef/SoftwareKatalogApp')">GitHub Repository</button>
            <button type="button" id="btnManualUpdate" class="action-btn" style="margin-top: 0; margin-left: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text);" onclick="_checkForUpdatesUI()">Nach Updates suchen</button>
            <span id="updateContainer" style="margin-left: 10px;"></span>
          </div>
        </div>

        <div style="margin-top: 30px; text-align: right;">
          <button type="button" class="action-btn" onclick="_saveSettings()">Speichern & Anwenden</button>
        </div>
      `;
      document.getElementById('modalOverlay').style.display = 'flex';

      // Starte die Update-Prüfung im Hintergrund
      _checkForUpdatesUI();
    }

    async function _checkForUpdatesUI() {
      const container = document.getElementById('updateContainer');
      const btn = document.getElementById('btnManualUpdate');
      if (!container || !window.electronAPI) return;

      if (btn) btn.disabled = true;
      container.innerHTML = '<span style="color: gray; font-size: 0.9em;">Suche nach Updates...</span>';

      const res = await window.electronAPI.checkUpdate();
      if (btn) btn.disabled = false;

      if (res.error) {
        container.innerHTML = `<span style="color: var(--text); opacity: 0.7; font-size: 0.9em;">Update-Prüfung fehlgeschlagen.</span>`;
      } else if (res.updateAvailable) {
        container.innerHTML = `<button type="button" class="action-btn" style="margin-top: 0; background: #a6e3a1; color: var(--bg);" onclick="_openExternalUrl('${res.releaseUrl}')">Update verfügbar (v${res.latestVersion})</button>`;
        if (btn) btn.style.display = 'none';
      } else {
        container.innerHTML = '<span style="color: #a6e3a1; font-size: 0.9em;">✓ App ist auf dem neuesten Stand</span>';
        if (btn) btn.style.display = 'none';
      }
    }

    async function _browseFile(inputId, isDir, filters) {
      const selectedPath = isDir ? await window.electronAPI.selectTargetDir() : await window.electronAPI.selectFile(filters);
      if (selectedPath) document.getElementById(inputId).value = selectedPath;
    }

    async function _saveSettings() {
      const checkedCats = Array.from(document.querySelectorAll('input[name="hiddenCatCheck"]:checked')).map(cb => cb.value);

      const newSettings = {
        targetPath: document.getElementById('cfgTarget').value,
        jsonPath: document.getElementById('cfgJson').value,
        scriptPath: document.getElementById('cfgScript').value,
        scanNested: document.getElementById('cfgScanNested').checked,
        nestedDepth: parseInt(document.getElementById('cfgNestedDepth').value, 10),
        visibleHiddenCats: checkedCats,
        updateInterval: parseInt(document.getElementById('cfgUpdateInterval').value, 10)
      };

      const res = await window.electronAPI.saveSettings(newSettings);
      if (res.success) {
        document.getElementById('modalOverlay').style.display='none';
        await init(); // Lädt Katalog und wendet die neuen Sichtbarkeiten sofort an!
        alert("Einstellungen gespeichert. Falls sich Pfade geändert haben, starte bitte einen Scan.");
      } else {
        alert(`Fehler beim Speichern:\n${res.error}`);
      }
    }

    _loadAppInfo();
    init();
  </script>
</body>
</html>
