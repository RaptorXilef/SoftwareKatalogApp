<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Software Katalog by © Felix Maywald</title>
  <!-- Strikte CSP: unsafe-inline für scripts entfernt! -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; connect-src 'self'; media-src 'self' file:;">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="dropOverlay">
    <h2>Ordner hier ablegen zum Hinzufügen</h2>
  </div>

  <div class="header">
    <h1>Software Katalog <span class="subtitle">by © Felix Maywald <span id="appVersion"></span></span></h1>
    <button type="button" class="icon-btn" id="btnSettingsToggle" title="Einstellungen" aria-label="Einstellungen">⚙️</button>
  </div>

  <div class="toolbar" id="mainToolbar">
    <div style="display: flex; gap: 15px; width: 100%; flex-wrap: wrap; align-items: center;">

      <!-- Suchleiste mit Löschen-Button -->
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Software suchen (Strg+F)...">
        <button type="button" id="clearSearchBtn" class="clear-btn" title="Suche leeren">✖</button>
      </div>

      <!-- Sortier-Dropdown -->
      <select id="sortSelect" class="sort-dropdown" title="Sortierung">
        <option value="az">A - Z</option>
        <option value="update">Update verfügbar</option>
        <option value="installed">Installiert</option>
        <option value="newest">Zuletzt hinzugefügt</option>
        <option value="updated">Zuletzt aktualisiert</option>
      </select>

      <button type="button" id="btnAddSoftware" class="action-btn" style="margin: 0; background: var(--accent); color: var(--bg);" title="Fügt einen vorhandenen Ordner zum Katalog hinzu.">➕ Software hinzufügen</button>
      <button type="button" id="btnScan" class="action-btn" style="margin: 0;" data-scan-mode="quick" title="Sucht netzwerkschonend nach neuen Software-Ordnern. Bekannte Ordner werden übersprungen.">Neu scannen</button>
      <button type="button" id="btnUpdate" class="action-btn" style="margin: 0; background: #a6e3a1; color: var(--bg);" data-scan-mode="update" title="Liest Metadaten und Bilder der bereits bekannten Programme blitzschnell neu ein.">Metadaten aktualisieren</button>
      <button type="button" id="btnAutoDetectAll" class="action-btn" style="margin: 0; background: #cba6f7; color: var(--bg);" title="Durchsucht automatisch die Registry für alle Programme, bei denen noch kein Pfad hinterlegt wurde.">🌐 Alle Pfade suchen</button>
      <button type="button" id="btnLocalVersions" class="action-btn" style="margin: 0; background: #94e2d5; color: var(--bg);" title="Liest die Versionsnummern aller lokal installierten Programme auf diesem PC aus.">🔍 Lokale Versionen</button>
      <button type="button" id="btnFullScan" class="action-btn" style="margin: 0; background: var(--border);" data-scan-mode="full" title="Verwirft den aktuellen Katalog und liest das gesamte Laufwerk komplett neu ein.">Vollständiger Rescan</button>

      <!-- Zweizeiliger Katalogzähler, optisch exakt an Button-Höhe angepasst -->
      <div style="margin-left: auto; text-align: right; display: flex; flex-direction: column; justify-content: center; height: 38px; line-height: 1.2;">
        <span style="font-weight: bold; color: var(--accent); font-size: 1.05em;"><span id="catalogCountDisplay">0</span> Programme</span>
        <span style="color: var(--text); opacity: 0.6; font-size: 0.85em;">im Katalog</span>
      </div>
    </div>

    <!-- Status-Banner ist jetzt Teil der klebenden Leiste -->
    <div id="scanStatus" class="scan-status" style="display: none;">
      <div style="display: flex; align-items: center; gap: 15px;">
        <div class="spinner" style="margin: 0; width: 24px; height: 24px;"></div>
        <div style="flex: 1; overflow: hidden;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
            <strong id="scanTargetText" style="color: var(--accent); font-size: 0.95em;">Scanner wird initialisiert...</strong>
            <span id="scanPercentText" style="font-size: 0.85em; font-weight: bold; color: var(--text);">0%</span>
          </div>
          <div id="scanPathText" style="font-family: monospace; font-size: 0.8em; color: var(--text); opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px;">Warte auf Verzeichnisse...</div>

          <div style="width: 100%; background: var(--surface); height: 6px; border-radius: 3px; overflow: hidden;">
            <div id="scanProgressBar" style="width: 0%; height: 100%; background: var(--accent); transition: width 0.2s linear;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Collapsible Tags -->
    <details id="tagsDetails">
      <summary>Kategorien & Filter ein/ausblenden</summary>
      <div class="tags" id="tagContainer"></div>
    </details>
  </div>

  <div class="grid" id="grid"></div>

  <!-- Standard Modal Container -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
    <div class="modal" id="modalContent">
      <!-- Modal Content gets injected here -->
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox-overlay" id="lightboxOverlay" role="dialog" aria-modal="true">
    <button type="button" class="lightbox-arrow left" id="lightboxBtnLeft" aria-label="Zurück">&#10094;</button>
    <img id="lightboxImg" src="" alt="Vollbildansicht" style="display:none; max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    <video id="lightboxVid" src="" controls style="display:none; max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); outline: none;">
      <track kind="captions" src="" label="Keine Untertitel" default>
    </video>
    <button type="button" class="lightbox-arrow right" id="lightboxBtnRight" aria-label="Vor">&#10095;</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
